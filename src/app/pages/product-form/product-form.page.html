<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/products" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEditMode ? 'Editar Producto' : 'Nuevo Producto' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding page-content">
  <div class="main-container">
    <div class="form-card">
      <div class="form-header">
        <div class="icon-circle">
          <ion-icon name="cube-outline"></ion-icon>
        </div>
        <h2>{{ isEditMode ? 'Modificar Registro' : 'Registrar Producto' }}</h2>
        <p>Ingresa la información requerida para la gestión del catálogo.</p>
      </div>

      <form (ngSubmit)="onSubmit()" #productForm="ngForm">
        <div class="input-stack">
          <div class="form-field">
            <ion-item lines="none" class="designer-input">
              <ion-input
                label="Nombre del producto"
                labelPlacement="stacked"
                type="text"
                placeholder="Ej. Laptop Pro 15''"
                [(ngModel)]="product.name"
                name="name"
                required>
              </ion-input>
            </ion-item>
          </div>

          <div class="form-field">
            <ion-item lines="none" class="designer-input">
              <ion-select
                label="Categoría"
                labelPlacement="stacked"
                placeholder="Selecciona una opción"
                [(ngModel)]="product.category"
                name="category"
                required>
                <ion-select-option *ngFor="let cat of categories" [value]="cat">
                  {{ cat }}
                </ion-select-option>
              </ion-select>
            </ion-item>
          </div>

          <div class="form-row">
            <div class="form-field col">
              <ion-item lines="none" class="designer-input">
                <ion-input
                  label="Precio ($ USD)"
                  labelPlacement="stacked"
                  type="number"
                  step="0.01"
                  placeholder="0.00"
                  [(ngModel)]="product.price"
                  name="price"
                  required>
                </ion-input>
              </ion-item>
            </div>

            <div class="form-field col">
              <ion-item lines="none" class="designer-input">
                <ion-input
                  label="Stock (Unidades)"
                  labelPlacement="stacked"
                  type="number"
                  placeholder="0"
                  [(ngModel)]="product.stock"
                  name="stock"
                  required>
                </ion-input>
              </ion-item>
            </div>
          </div>

          <div class="form-field">
            <ion-item lines="none" class="designer-input">
              <ion-select
                label="Estado de disponibilidad"
                labelPlacement="stacked"
                [(ngModel)]="product.status"
                name="status"
                required>
                <ion-select-option value="available">Disponible</ion-select-option>
                <ion-select-option value="low_stock">Poco Stock</ion-select-option>
                <ion-select-option value="out_of_stock">Agotado</ion-select-option>
              </ion-select>
            </ion-item>
          </div>

          <div class="form-field">
            <ion-item lines="none" class="designer-input">
              <ion-textarea
                label="Descripción detallada"
                labelPlacement="stacked"
                placeholder="Características opcionales..."
                rows="3"
                [(ngModel)]="product.description"
                name="description">
              </ion-textarea>
            </ion-item>
          </div>
        </div>

        <div class="form-actions ion-margin-top">
          <ion-button type="submit" expand="block" class="primary-btn" size="large">
            <ion-icon name="save-outline" slot="start"></ion-icon>
            {{ isEditMode ? 'Actualizar Producto' : 'Guardar Producto' }}
          </ion-button>

          <ion-button expand="block" fill="clear" color="medium" routerLink="/products">
            Cancelar
          </ion-button>
        </div>
      </form>
    </div>
  </div>
</ion-content>
